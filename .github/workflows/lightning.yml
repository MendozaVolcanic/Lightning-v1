name: Lightning — WWLLN + GLM Volcanic Monitor

on:
  schedule:
    - cron: '*/10 * * * *'   # fallback; el cron real es cron-job.org cada 5 min
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wwlln_scraper.py'
      - 'glm_scraper.py'
      - 'merger.py'
      - 'volcanoes.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/lightning.yml'

# IMPORTANTE: la concurrencia va a nivel de JOB, no de workflow.
#
# Incidente 2026-08-06 → 2026-08-13 (7 días sin datos): con un único grupo
# de concurrencia a nivel de workflow, un deployment de Pages que quedó
# colgado en estado `waiting` mantuvo el run vivo indefinidamente. Como
# GitHub sólo admite un run pendiente por grupo, los 199 runs siguientes
# (uno cada 5 min) se cancelaron sin ejecutar un solo step. El scraper
# nunca falló: quedó rehén del deploy.
#
# `timeout-minutes` no protege contra esto: ese reloj cuenta tiempo de
# ejecución, y un job detenido en la compuerta del environment todavía no
# está ejecutando. El job figuró "corriendo" 7 días con timeout de 8 min.
#
# Por eso el scan y el deploy tienen ahora grupos separados:
#   - scan   → serializado (cancel-in-progress: false) para no corromper
#              el git commit/push a medio escribir.
#   - deploy → desechable (cancel-in-progress: true): si un deploy se
#              cuelga, el del run siguiente lo cancela a los 5 min. Un
#              deploy perdido no cuesta nada — el próximo scan republica
#              docs/ completo. Un scan perdido sí: es un hueco en la serie.

# Fuerza actions/checkout@v4 + actions/setup-python@v5 sobre Node 24
# antes del cutover automático de GitHub (16-jun-2026). Removible
# después de esa fecha cuando Node 24 sea el default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: adquisición de datos ──────────────────────────────────────────
  # Nunca depende del estado de Pages. Su producto es el commit al repo;
  # el artifact para Pages es un subproducto.
  lightning-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    permissions:
      contents: write   # commit/push de datos al repo

    concurrency:
      group: lightning-scan
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest

      - name: Smoke tests (lógica pura)
        run: python -m pytest tests/test_smoke.py -q

      - name: Scan WWLLN
        run: python wwlln_scraper.py
        continue-on-error: true

      - name: Scan GLM (GOES-19)
        run: python glm_scraper.py
        continue-on-error: true

      - name: Merge sources
        run: python merger.py

      - name: Commit results
        run: |
          git config user.name "LightningBot"
          git config user.email "lightning@georayos.com"
          git add docs/data/latest.json docs/data/wwlln_latest.json docs/data/glm_latest.json
          git add docs/datos/ 2>/dev/null || true
          git add datos/alert_history_*.csv 2>/dev/null || true
          git ls-files --deleted docs/datos/ datos/ | xargs git rm --cached 2>/dev/null || true
          if git diff --quiet --staged 2>/dev/null; then
            echo "Sin cambios"
          else
            REDS=$(python -c "import json,pathlib; p=pathlib.Path('docs/data/latest.json'); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get('red_alerts',0))" 2>/dev/null || echo 0)
            YELLOWS=$(python -c "import json,pathlib; p=pathlib.Path('docs/data/latest.json'); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get('yellow_alerts',0))" 2>/dev/null || echo 0)
            git commit -m "scan: $(date -u +'%Y-%m-%d %H:%M') | R=$REDS Y=$YELLOWS"
            git pull origin main --rebase -X ours || true
            git push origin main || true
          fi

      # Empaqueta el docs/ recién generado en disco (no re-checkout) → el
      # artifact lleva siempre los datos más frescos del scrape actual.
      # El deploy en sí ocurre en el job siguiente.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # ── Job 2: publicación ───────────────────────────────────────────────────
  # Aislado del scan. Si se cuelga o falla, los datos ya están commiteados
  # en el repo y el scan siguiente corre igual. Reemplaza al builder legacy
  # "Deploy from a branch", que fallaba con 401 intermitente bajo pushes
  # cada 5 min.
  deploy-pages:
    needs: lightning-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write      # deploy a GitHub Pages
      id-token: write   # OIDC requerido por actions/deploy-pages

    # Desechable a propósito: un deploy colgado se cancela solo cuando
    # llega el del run siguiente. Ver nota del incidente arriba.
    concurrency:
      group: lightning-deploy
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Acota el sondeo del estado del deployment a 5 min. Sin esto,
          # un deployment que queda en `waiting` hace que la action espere
          # su default de 10 min por iteración. Falla ruidoso > cuelga mudo.
          timeout: 300000
