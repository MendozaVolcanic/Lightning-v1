name: Lightning — WWLLN + GLM Volcanic Monitor

on:
  schedule:
    - cron: '*/10 * * * *'   # fallback; el cron real es cron-job.org cada 5 min
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wwlln_scraper.py'
      - 'glm_scraper.py'
      - 'merger.py'
      - 'volcanoes.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/lightning.yml'

# Evita que dos runs concurrentes interfieran en el git commit/push.
# `cancel-in-progress: false` para no perder datos a medio escribir.
concurrency:
  group: lightning-scan
  cancel-in-progress: false

# Fuerza actions/checkout@v4 + actions/setup-python@v5 sobre Node 24
# antes del cutover automático de GitHub (16-jun-2026). Removible
# después de esa fecha cuando Node 24 sea el default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  lightning-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest

      - name: Smoke tests (lógica pura)
        run: python -m pytest tests/test_smoke.py -q

      - name: Scan WWLLN
        run: python wwlln_scraper.py
        continue-on-error: true

      - name: Scan GLM (GOES-19)
        run: python glm_scraper.py
        continue-on-error: true

      - name: Merge sources
        run: python merger.py

      - name: Commit results
        run: |
          git config user.name "LightningBot"
          git config user.email "lightning@georayos.com"
          git add docs/data/latest.json docs/data/wwlln_latest.json docs/data/glm_latest.json
          git add docs/datos/ 2>/dev/null || true
          git add datos/alert_history_*.csv 2>/dev/null || true
          git ls-files --deleted docs/datos/ datos/ | xargs git rm --cached 2>/dev/null || true
          if git diff --quiet --staged 2>/dev/null; then
            echo "Sin cambios"
          else
            REDS=$(python -c "import json,pathlib; p=pathlib.Path('docs/data/latest.json'); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get('red_alerts',0))" 2>/dev/null || echo 0)
            YELLOWS=$(python -c "import json,pathlib; p=pathlib.Path('docs/data/latest.json'); d=json.loads(p.read_text()) if p.exists() else {}; print(d.get('yellow_alerts',0))" 2>/dev/null || echo 0)
            git commit -m "scan: $(date -u +'%Y-%m-%d %H:%M') | R=$REDS Y=$YELLOWS"
            git pull origin main --rebase -X ours || true
            git push origin main || true
          fi
